[package]
name = "market_tui"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & Max"]
description = "High-contrast, polished TUI for tracking real-time and historical stock and cryptocurrency data"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
futures = "0.3"
